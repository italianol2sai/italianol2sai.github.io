<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../">
<title>Italiano L2 ETNIE · prova indice</title>
<style>
  :root { --bg:#fbf7f0; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#e5ddd0; --soft:#f3ece0; --green:#1f8a4c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#15181c; --card:#1f242a; --ink:#f1f3f5; --muted:#9aa3ad; --line:#333a43; --soft:#262c33; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .banner { background:#fff6d6; color:#5b4a00; border:1px solid #ecd98a; border-radius:12px; padding:10px 14px; font-size:14px; margin-bottom:16px; }
  @media (prefers-color-scheme: dark) { .banner { background:#3a3410; color:#f2e3a0; border-color:#6b5d1c; } }

  .views { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .views button { flex:1 1 auto; min-height:44px; border:1px solid var(--line); background:var(--card); color:var(--ink);
                  border-radius:12px; font-size:15px; cursor:pointer; padding:6px 10px; }
  .views button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  input[type=search] { width:100%; min-height:48px; border:1px solid var(--line); background:var(--card); color:var(--ink);
                       border-radius:12px; padding:8px 14px; font-size:17px; margin-bottom:10px; }
  .chips { display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto; margin:0 -16px 10px; padding:0 16px 4px; scrollbar-width:thin; }
  .chips button { flex:none; min-height:38px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
                  font-size:14px; padding:2px 12px; cursor:pointer; }
  .chips button[aria-pressed="true"] { background:var(--green); border-color:var(--green); color:#fff; }
  .count { color:var(--muted); font-size:13px; margin:4px 0 12px; }
  button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid var(--green); outline-offset:2px; }

  /* schede */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
  .tcard { text-align:left; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:16px;
           padding:14px; cursor:pointer; min-height:110px; display:flex; flex-direction:column; gap:4px; }
  .tcard .ic { font-size:34px; line-height:1; }
  .tcard b { font-size:16px; }
  .tcard small { color:var(--muted); }
  .tcard[aria-expanded="true"] { border-color:var(--ink); }
  .panel { grid-column:1/-1; background:var(--card); border:1px solid var(--ink); border-radius:16px; padding:6px 12px 12px; }
  .panel h3, .grp h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; }

  /* righe attività */
  a.row { display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--soft);
          color:inherit; text-decoration:none; border:1px solid transparent; margin-bottom:6px; min-height:44px; }
  a.row:hover { border-color:var(--ink); }
  a.row .ic { font-size:22px; }
  a.row .t { flex:1; font-size:15px; }
  .lv { font-size:12px; font-weight:700; border:1px solid var(--line); color:var(--muted); border-radius:99px; padding:1px 8px; white-space:nowrap; }
  .ext { color:var(--muted); font-size:13px; }

  /* livelli */
  details.lev { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:10px; }
  details.lev > summary { list-style:none; display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; font-weight:700; font-size:17px; }
  details.lev > summary::-webkit-details-marker { display:none; }
  details.lev > summary::after { content:"+"; margin-left:auto; font-size:26px; font-weight:300; color:var(--muted); }
  details.lev[open] > summary::after { content:"–"; }
  details.lev .in { padding:0 12px 12px; }
  .badge { font-weight:400; color:var(--muted); font-size:14px; }

  /* tabella */
  .tw { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--card); }
  table { border-collapse:collapse; width:100%; font-size:14px; min-width:560px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { position:sticky; top:0; background:var(--soft); cursor:pointer; user-select:none; white-space:nowrap; }
  th button { all:unset; cursor:pointer; font-weight:700; }
  td a { color:var(--ink); }

  /* studenti */
  .stu .big { display:flex; align-items:center; gap:14px; width:100%; text-align:left; text-transform:uppercase;
              font-size:20px; font-weight:800; min-height:76px; padding:12px 16px; border-radius:20px; border:2px solid var(--line);
              background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; margin-bottom:10px; }
  .stu .big .ic { font-size:40px; }
  .stu .big small { display:block; font-size:13px; font-weight:600; color:var(--muted); }
  .stu .back { min-height:52px; font-size:18px; font-weight:800; }
  .stu .lvic { font-size:22px; font-weight:800; min-width:56px; height:56px; display:grid; place-items:center; border-radius:14px; background:var(--green); color:#fff; }
  .stu.minu .big, .stu.minu h3 { text-transform:none; }
  .stu h3 { font-size:18px; margin:18px 0 8px; text-transform:uppercase; }
  /* riprendi + ultime aggiunte */
  #top { display:grid; gap:10px; margin:0 0 14px; }
  .resume { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:14px; text-decoration:none;
            background:var(--green); color:#fff; font-weight:700; }
  .resume small { display:block; font-weight:500; opacity:.85; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .resume .ic { font-size:26px; }
  .new h2 { font-size:15px; margin:4px 0 6px; }
  .newrow { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; }
  .newrow a { flex:0 0 auto; width:170px; scroll-snap-align:start; padding:10px 12px; border:1px solid var(--line); border-radius:12px;
              background:var(--card); color:var(--ink); text-decoration:none; font-size:14px; font-weight:600; display:grid; gap:4px; }
  .newrow a small { color:var(--muted); font-weight:500; font-size:12px; }
  .hide { display:none !important; }
  .empty { padding:30px 10px; text-align:center; color:var(--muted); }
</style>
</head>

  <p class="sub">Versione di prova dell'indice: stessi link, quattro modi di sfogliarli.</p>
  <div class="banner">Pagina di prova. Non sostituisce la pagina principale e non modifica nessun link.</div>

  <div id="top"></div>

    <button data-view="tabella" aria-pressed="false">📋 Tabella</button>

  <div id="filters">

    <div class="chips" id="lvChips" role="group" aria-label="Livello"></div>
    <div class="chips" id="tyChips" role="group" aria-label="Tipo di attività"></div>
    <div class="count" id="count" aria-live="polite"></div>
  </div>
  <div id="out"></div>
</main>

const TOP = Object.fromEntries(D.topics.map(t => [t.id, t]));
const TYP = Object.fromEntries(D.types.map(t => [t.id, t]));
const S = { view: "schede", q: "", lv: "", ty: "", open: "", stu: "", stuLv: "", sort: ["t", 1] };
try { const v = localStorage.getItem("indice-vista"); if (v) S.view = v; } catch (e) {}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const lvTxt = it => it.lv.length ? it.lv.join("–") : "";

function filtered(opts) {
  const q = norm(S.q.trim());
  return D.items.filter(it => {
    if (!(opts && opts.ignoreFilters)) {
      if (S.lv && !it.lv.includes(S.lv)) return false;
      if (S.ty && it.ty !== S.ty) return false;
    }
    if (q) {
      const hay = norm(it.t + " " + TOP[it.tp].name + " " + TYP[it.ty].name);
      if (!q.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
}
function row(it) {
  return `<a class="row" href="${esc(it.h)}"${it.x ? ' target="_blank" rel="noopener"' : ""}>
    <span class="ic" aria-hidden="true">${TYP[it.ty].icon}</span><span class="t">${esc(it.t)}</span>
    ${it.x ? '<span class="ext" title="Sito esterno">↗</span>' : ""}${lvTxt(it) ? `<span class="lv">${lvTxt(it)}</span>` : ""}</a>`;
}
function groupByType(list) {
  return D.types.map(ty => {
    const l = list.filter(i => i.ty === ty.id);
    return l.length ? `<h3>${ty.icon} ${ty.name} (${l.length})</h3>${l.map(row).join("")}` : "";
  }).join("");
}

/* ---- viste ---- */
function vSchede(list) {
  const cards = D.topics.map(tp => {
    const l = list.filter(i => i.tp === tp.id);
    if (!l.length) return "";
    const open = S.open === tp.id || (S.q && list.length < 40);
    return `<button class="tcard" data-topic="${tp.id}" aria-expanded="${S.open === tp.id}"><span class="ic">${tp.icon}</span><b>${esc(tp.name)}</b><small>${l.length} attività</small></button>` +
      (S.open === tp.id ? `<div class="panel">${groupByType(l)}</div>` : "");
  }).join("");
  return `<div class="grid">${cards}</div>`;
}
function vLivelli(list) {
  const lv = [...D.levels, ""];
  return lv.map(L => {
    const l = list.filter(i => (L ? i.lv[0] === L : !i.lv.length));
    if (!l.length) return "";
    const open = (S.q || S.lv || S.ty) ? " open" : "";
    const inner = D.topics.map(tp => {
      const t = l.filter(i => i.tp === tp.id);
      return t.length ? `<div class="grp"><h3>${tp.icon} ${esc(tp.name)} (${t.length})</h3>${t.map(row).join("")}</div>` : "";
    }).join("");
    return `<details class="lev"${open}><summary>${L || "Livello non indicato"} <span class="badge">${l.length} attività</span></summary><div class="in">${inner}</div></details>`;
  }).join("");
}
const LVNOME = { A0: "Primi passi", A1: "Base", A2: "Base 2", B1: "Intermedio", B2: "Intermedio 2", C1: "Avanzato", C2: "Avanzato 2" };
function vStudenti(list) {
  // 1) scegli il livello  2) scegli l'argomento  3) le attività
  if (!S.stuLv) {
    return `<div class="stu"><h2>Qual è il tuo livello?</h2>` + D.levels.map(L => {
      const n = list.filter(i => i.ty !== "verifica" && i.lv.includes(L)).length;
      return n ? `<button class="big" data-stulv="${L}"><span class="ic lvic">${L}</span><span>${LVNOME[L]}<small>${n} attività</small></span></button>` : "";
    }).join("") + `<button class="big" data-stulv="*"><span class="ic">🌍</span><span>Tutti i livelli<small>${list.filter(i => i.ty !== "verifica").length} attività</small></span></button></div>`;
  }
  const base = list.filter(i => i.ty !== "verifica" && (S.stuLv === "*" || i.lv.includes(S.stuLv)));
  const minu = ["A2", "B1", "B2", "C1", "C2"].includes(S.stuLv) ? " minu" : "";  // maiuscolo solo per A0 e A1
  const lvName = S.stuLv === "*" ? "Tutti i livelli" : S.stuLv + " · " + LVNOME[S.stuLv];
  if (!S.stu) {
    return `<div class="stu${minu}"><button class="big back" data-stulv="">← Cambia livello</button><h2>${esc(lvName)}</h2>` + D.topics.map(tp => {
      const n = base.filter(i => i.tp === tp.id).length;
      return n ? `<button class="big" data-stu="${tp.id}"><span class="ic">${tp.icon}</span><span>${esc(tp.name)}<small>${n}</small></span></button>` : "";
    }).join("") + `</div>`;
  }
  const l = base.filter(i => i.tp === S.stu);
  const body = D.types.map(ty => {
    const t = l.filter(i => i.ty === ty.id);
    return t.length ? `<h3>${ty.icon} ${ty.name}</h3>` + t.map(i =>
      `<a class="big" href="${esc(i.h)}"${i.x ? ' target="_blank" rel="noopener"' : ""}><span class="ic">${ty.icon}</span><span>${esc(i.t)}</span></a>`).join("") : "";
  }).join("");
  return `<div class="stu${minu}"><button class="big back" data-stu="">← Torna agli argomenti</button><h2>${TOP[S.stu].icon} ${esc(TOP[S.stu].name)} <span class="badge">${esc(lvName)}</span></h2>${body}</div>`;
}
function vTabella(list) {
  const [k, d] = S.sort;
  const key = i => k === "t" ? norm(i.t) : k === "tp" ? TOP[i.tp].name : k === "lv" ? (i.lv[0] || "Z") : TYP[i.ty].name;
  const l = [...list].sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * d);
  const th = (c, n) => `<th><button data-sort="${c}">${n}${S.sort[0] === c ? (S.sort[1] > 0 ? " ▲" : " ▼") : ""}</button></th>`;
  return `<div class="tw"><table><thead><tr>${th("t", "Attività")}${th("tp", "Argomento")}${th("lv", "Livello")}${th("ty", "Tipo")}</tr></thead><tbody>` +
    l.map(i => `<tr><td><a href="${esc(i.h)}"${i.x ? ' target="_blank" rel="noopener"' : ""}>${esc(i.t)}</a>${i.x ? " ↗" : ""}</td><td>${TOP[i.tp].icon} ${esc(TOP[i.tp].name)}</td><td>${lvTxt(i)}</td><td>${TYP[i.ty].icon} ${TYP[i.ty].name}</td></tr>`).join("") +
    `</tbody></table></div>`;
}

/* ---- riprendi da dove eri + ultime aggiunte ---- */
const MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
const dTxt = t => { const d = new Date(t * 1000); return d.getDate() + " " + MESI[d.getMonth()]; };
function vTop() {
  let last = null;
  try { last = JSON.parse(localStorage.getItem("indice-ultima") || "null"); } catch (e) {}
  const it = last && D.items.find(i => i.h === last);
  const resume = it ? `<a class="resume" href="${esc(it.h)}"${it.x ? ' target="_blank" rel="noopener"' : ""}><span class="ic">▶️</span><span><small>Riprendi da dove eri</small>${esc(it.t)}</span></a>` : "";
  const nuovi = D.items.filter(i => i.d && !/esercizi\.html$/.test(i.h)).sort((a, b) => b.d - a.d).slice(0, 8);
  const news = nuovi.length ? `<div class="new"><h2>🆕 Ultime aggiunte</h2><div class="newrow">` + nuovi.map(i =>
    `<a href="${esc(i.h)}"${i.x ? ' target="_blank" rel="noopener"' : ""}><span>${TYP[i.ty].icon} ${esc(i.t)}</span><small>${TOP[i.tp].icon} ${esc(TOP[i.tp].name)}${lvTxt(i) ? " · " + lvTxt(i) : ""} · ${dTxt(i.d)}</small></a>`).join("") + `</div></div>` : "";
  return resume + news;
}

function chips() {
  const mk = (id, items, cur, all) => {
    document.getElementById(id).innerHTML = `<button data-v="" aria-pressed="${!cur}">${all}</button>` +
      items.map(x => `<button data-v="${x.v}" aria-pressed="${cur === x.v}">${x.l}</button>`).join("");
  };
  mk("lvChips", D.levels.map(l => ({ v: l, l })), S.lv, "Tutti i livelli");
  mk("tyChips", D.types.map(t => ({ v: t.id, l: t.icon + " " + t.name })), S.ty, "Tutti i tipi");
}
function render() {
  document.querySelectorAll(".views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  document.getElementById("filters").classList.toggle("hide", S.view === "studenti");
  chips();
  const top = document.getElementById("top");
  top.innerHTML = vTop();
  top.classList.toggle("hide", !!(S.q || S.lv || S.ty || S.stu || S.stuLv));
  const list = S.view === "studenti" ? D.items : filtered();
  const out = document.getElementById("out");
  out.innerHTML = list.length ? ({ schede: vSchede, livelli: vLivelli, studenti: vStudenti, tabella: vTabella }[S.view])(list)
                             : `<div class="empty">Nessuna attività trovata. Prova a togliere un filtro.</div>`;
  document.getElementById("count").textContent = S.view === "studenti" ? "" : `${list.length} attività su ${D.items.length}`;
  try { localStorage.setItem("indice-vista", S.view); } catch (e) {}
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (a && a.closest("#out, #top")) {
    const it = D.items.find(i => a.getAttribute("href") === i.h);
    if (it) try { localStorage.setItem("indice-ultima", JSON.stringify(it.h)); } catch (err) {}
    setTimeout(() => { document.getElementById("top").innerHTML = vTop(); }, 300);
  }
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.view) { S.view = b.dataset.view; S.stu = ""; S.stuLv = ""; render(); }
  else if (b.dataset.stulv !== undefined) { S.stuLv = b.dataset.stulv; S.stu = ""; render(); window.scrollTo(0, 0); }
  else if (b.dataset.topic) { S.open = S.open === b.dataset.topic ? "" : b.dataset.topic; render();
    const c = document.querySelector(`[data-topic="${S.open}"]`); if (c) c.scrollIntoView({ block: "nearest" }); }
  else if (b.closest("#lvChips")) { S.lv = b.dataset.v; render(); }
  else if (b.closest("#tyChips")) { S.ty = b.dataset.v; render(); }
  else if (b.dataset.stu !== undefined && b.classList.contains("big")) { S.stu = b.dataset.stu; render(); window.scrollTo(0, 0); }
  else if (b.dataset.sort) { S.sort = [b.dataset.sort, S.sort[0] === b.dataset.sort ? -S.sort[1] : 1]; render(); }
});
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; render(); });
render();
</script>
</body>
</html>
