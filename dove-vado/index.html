<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DOVE VADO? COSA FACCIO? – ITALIANO A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF1F8; --dot:#CFDDF0; --ink:#14233F; --card:#FFFFFF; --muted:#5A6A85; --line:#C9D6E6;
  --ol:#14233F; --sign:#1B4F9C; --sun:#FFC72C; --tomato:#E8443A; --ok:#1E9E52; --bad:#D6332B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1A2E; --dot:#1C2B47; --ink:#EEF3FA; --card:#1B2A45; --muted:#A5B4CC; --line:#2C3F63; --ol:#050B16; }
}
:root[data-theme="dark"]{ --bg:#0F1A2E; --dot:#1C2B47; --ink:#EEF3FA; --card:#1B2A45; --muted:#A5B4CC; --line:#2C3F63; --ol:#050B16; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0; min-height:100%;
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.8px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:'Lexend','Verdana','Segoe UI',system-ui,sans-serif;
  text-transform:uppercase; letter-spacing:.02em;
}
.comic{font-family:'Bangers','Impact','Arial Black',sans-serif; letter-spacing:.05em; font-weight:400}
button{
  font:inherit; font-weight:600; text-transform:uppercase; letter-spacing:.03em;
  cursor:pointer; border:3px solid var(--ol); border-radius:14px;
  padding:.6em 1.1em; background:var(--card); color:var(--ink);
  box-shadow:0 5px 0 var(--ol); transition:transform .08s, box-shadow .08s;
}
button:active{transform:translateY(4px); box-shadow:0 1px 0 var(--ol)}
button:focus-visible{outline:4px solid var(--sun); outline-offset:3px}
button:disabled{cursor:default}
.go{background:var(--sign); color:#fff}

/* ---------- HEADER + MASCOTTE ---------- */
header{display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; padding:.8rem 1.4rem}
.buddy{flex:1; display:flex; align-items:center; gap:1.3rem; min-width:280px}
.mascot{width:clamp(64px,7vw,104px); flex:none}
.mascot svg{display:block; width:100%}
.mascot.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{
  position:relative; background:#fff; color:#14233F; border:3px solid var(--ol); border-radius:26px;
  padding:.3em .9em .25em; font-size:clamp(1.3rem,2.6vw,2.5rem); line-height:1.1;
}
.bubble::before,.bubble::after{content:""; position:absolute; top:50%; border-style:solid; border-color:transparent}
.bubble::before{left:-20px; margin-top:-11px; border-width:11px 20px 11px 0; border-right-color:var(--ol)}
.bubble::after{left:-14px; margin-top:-8px; border-width:8px 15px 8px 0; border-right-color:#fff}
.score{
  display:flex; align-items:center; gap:.4rem; background:var(--sun); color:#14233F;
  border:3px solid var(--ol); border-radius:14px; padding:.25em .8em; font-size:clamp(1.3rem,2.4vw,2.2rem);
  box-shadow:0 5px 0 var(--ol);
}
.score.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25) rotate(-4deg)}}

main{padding:0 1.4rem 2rem; max-width:1500px; margin:0 auto}
.view{display:none}
.view.on{display:block}

.sign{
  display:inline-block; background:var(--sign); color:#fff;
  border:.12em solid #fff; outline:.12em solid var(--sign);
  border-radius:.35em; padding:.12em .7em; font-weight:800; line-height:1.15;
}

/* ---------- HOME ---------- */
.intro{text-align:center; margin:.6rem auto 1.8rem}
.intro h2{
  margin:0; font-size:clamp(2.8rem,8vw,7rem); line-height:1; color:var(--sun);
  -webkit-text-stroke:3px #14233F; text-shadow:6px 6px 0 #14233F; transform:rotate(-2deg);
}
.intro p{font-size:clamp(1rem,1.7vw,1.5rem); color:var(--muted); margin:1.2rem 0 0; font-weight:600}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1.6rem}
.tile{
  text-align:left; padding:1.2rem 1.3rem 1.4rem; border-radius:20px;
  display:flex; flex-direction:column; gap:.4rem; box-shadow:8px 8px 0 var(--ol);
}
.tile:nth-child(odd){transform:rotate(-1.2deg)}
.tile:nth-child(even){transform:rotate(1deg)}
.tile:active{box-shadow:3px 3px 0 var(--ol)}
.tile .ic{font-size:clamp(2.4rem,4vw,3.6rem); line-height:1}
.tile b{font-size:clamp(1.6rem,2.6vw,2.4rem); color:var(--sign)}
.tile span{font-size:clamp(.85rem,1.1vw,1.05rem); color:var(--muted); font-weight:400; line-height:1.4}
.tile:nth-child(1) b{color:#F57C00}.tile:nth-child(2) b{color:var(--tomato)}.tile:nth-child(3) b{color:#7B1FA2}.tile:nth-child(4) b{color:var(--ok)}
.strip{display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:2.2rem}
.strip div{width:clamp(80px,9.5vw,130px); border-radius:12px; overflow:hidden; border:3px solid var(--ol); box-shadow:4px 4px 0 var(--ol)}
.strip div:nth-child(odd){transform:rotate(-3deg)}
.strip div:nth-child(even){transform:rotate(2.5deg)}
.strip svg{display:block; width:100%}

.art svg{display:block; width:100%; height:100%}

/* ---------- FLASHCARD ---------- */
.flipwrap{perspective:1800px; width:min(94vw,1000px); height:min(58vh,620px); margin:.4rem auto 0}
.flip{position:relative; width:100%; height:100%; transition:transform .6s; transform-style:preserve-3d; cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:28px; background:var(--card); border:10px solid var(--c);
  outline:4px solid var(--ol); box-shadow:0 12px 0 var(--ol);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:1rem; overflow:hidden; gap:.8rem;
}
.face.back{transform:rotateY(180deg)}
.face.front .art{flex:1; width:100%; min-height:0}
.face.front .sign{font-size:clamp(1.8rem,5vw,4.2rem)}
.face.back .art{height:38%; width:100%}
.face.back .sign{font-size:clamp(1.1rem,2.4vw,2rem)}
.sent{font-size:clamp(1.4rem,3.6vw,3.2rem); font-weight:600; text-align:center; line-height:1.35; max-width:24ch}
mark{background:var(--c); color:#fff; padding:0 .25em; border-radius:.25em}
.tap{font-size:clamp(.8rem,1.2vw,1.1rem); color:var(--muted)}
.controls{display:flex; justify-content:center; align-items:center; gap:.8rem; flex-wrap:wrap; margin-top:1.6rem}
.controls button{font-size:clamp(1rem,1.7vw,1.5rem)}
.count{font-size:clamp(1.4rem,2.4vw,2.2rem); min-width:4em; text-align:center}

/* ---------- QUIZ + PARLA ---------- */
.two{display:grid; grid-template-columns:1fr 1.1fr; gap:2rem; align-items:center; margin-top:.8rem}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.frame{border-radius:26px; overflow:hidden; border:10px solid var(--c); outline:4px solid var(--ol); box-shadow:10px 10px 0 var(--ol); background:var(--card); transform:rotate(-1deg)}
.frame .art{aspect-ratio:4/3}
.qside .sign{font-size:clamp(1.3rem,3vw,2.6rem)}
.qside .sent{text-align:left; margin:1.1rem 0 1.4rem; max-width:none}
.blank{display:inline-block; min-width:4.2em; border-bottom:.12em dashed var(--tomato); color:var(--tomato); text-align:center}
.blank.filled{border-bottom-style:solid; color:var(--ok)}
.opts{display:grid; gap:.9rem}
.opt{font-size:clamp(1.3rem,2.8vw,2.4rem); padding:.45em; border-radius:18px}
.opt.ok{background:var(--ok); color:#fff}
.opt.bad{background:var(--bad); color:#fff; animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.dots{display:flex; gap:.5rem; justify-content:center; margin-top:1.4rem}
.dots i{width:16px; height:16px; border-radius:50%; background:var(--card); border:3px solid var(--ol)}
.dots i.done{background:var(--ok)}
.dots i.now{background:var(--sun); transform:scale(1.3)}
.endbox{text-align:center; padding:3rem 1rem}
.endbox .big{font-size:clamp(3rem,9vw,7rem); color:var(--sun); -webkit-text-stroke:3px #14233F; text-shadow:6px 6px 0 #14233F}
.endbox p{font-size:clamp(1.2rem,2.4vw,2rem)}

/* ---------- MEMORY ---------- */
.mgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:1rem; margin-top:.6rem}
@media (max-width:900px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mcard{height:clamp(120px,22vh,205px); perspective:1000px; padding:0; border:none; background:none; box-shadow:none; border-radius:18px}
.mcard:active{transform:none; box-shadow:none}
.mi{position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d}
.mcard.open .mi,.mcard.done .mi{transform:rotateY(180deg)}
.mf{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:18px; display:flex; align-items:center; justify-content:center; overflow:hidden;
  border:4px solid var(--ol); box-shadow:0 6px 0 var(--ol);
}
.mf.cover{
  background-color:var(--sign);
  background-image:radial-gradient(rgba(255,255,255,.2) 2px, transparent 2.5px);
  background-size:14px 14px;
}
.mcard:nth-child(3n+2) .mf.cover{background-color:var(--tomato)}
.mcard:nth-child(3n) .mf.cover{background-color:#7B1FA2}
.num{
  font-size:clamp(3rem,6.5vw,6rem); color:var(--sun); line-height:1;
  -webkit-text-stroke:2px #14233F; text-shadow:4px 4px 0 #14233F;
}
.mf.face2{transform:rotateY(180deg); background:var(--card); padding:.5rem; outline:5px solid var(--c); outline-offset:-9px}
.mf.face2 .art{width:100%; height:100%}
.corner{
  position:absolute; top:4px; left:6px; z-index:1; background:var(--sun); color:#14233F;
  border:2px solid #14233F; border-radius:10px; padding:0 .35em; font-size:clamp(.9rem,1.5vw,1.4rem);
}
.mtxt{font-size:clamp(.72rem,1.15vw,1.15rem); font-weight:600; line-height:1.3; text-align:center; color:var(--ink); padding:0 .3rem}
.mcard.done .mf.face2{box-shadow:0 0 0 6px var(--ok)}

/* ---------- PARLA ---------- */
.reveal{display:flex; gap:.7rem; flex-wrap:wrap; margin:.2rem 0 1rem}
.reveal button{font-size:clamp(.95rem,1.5vw,1.3rem)}
.hidebox{min-height:2.2em; margin:.6rem 0}
.hidebox .sign{font-size:clamp(1.3rem,3vw,2.6rem)}
.pts{display:grid; grid-template-columns:repeat(2,1fr); gap:.8rem; margin-top:1.2rem}
.pts button{font-size:clamp(.95rem,1.5vw,1.3rem); text-align:left; line-height:1.3}
.pts b{font-size:1.5em}

/* ---------- ESPLOSIONE FUMETTO ---------- */
.burst{
  position:fixed; left:50%; top:48%; width:min(48vmin,440px); aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.3) rotate(-12deg); opacity:0; pointer-events:none; z-index:20;
}
.burst::before,.burst::after{
  content:""; position:absolute;
  clip-path:polygon(50% 0%,61.1% 15.8%,79.4% 9.5%,79.1% 28.8%,97.6% 34.5%,86% 50%,97.6% 65.5%,79.1% 71.2%,79.4% 90.5%,61.1% 84.2%,50% 100%,38.9% 84.2%,20.6% 90.5%,20.9% 71.2%,2.4% 65.5%,14% 50%,2.4% 34.5%,20.9% 28.8%,20.6% 9.5%,38.9% 15.8%);
}
.burst::before{inset:0; background:#14233F}
.burst::after{inset:6%; background:var(--sun)}
.bt{
  position:absolute; inset:0; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--tomato); -webkit-text-stroke:2px #14233F; font-size:clamp(2.4rem,8vmin,5rem); line-height:.95; text-align:center;
}
.bt small{font-size:.55em; color:#14233F; -webkit-text-stroke:0; margin-top:.2em}
.burst.show{animation:burst 1.2s}
@keyframes burst{
  0%{opacity:0; transform:translate(-50%,-50%) scale(.3) rotate(-12deg)}
  15%{opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(4deg)}
  30%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  80%{opacity:1}
  100%{opacity:0; transform:translate(-50%,-50%) scale(1.05) rotate(-3deg)}
}

@media (prefers-reduced-motion: reduce){
  .flip,.mi{transition:none}
  .burst.show,.score.pop,.opt.bad,.mascot.hop{animation:none}
  .burst.show{opacity:1; transform:translate(-50%,-50%)}
}
</style>
</head>
<body>

<header>
  <div class="buddy">
    <div class="mascot" id="mascot" aria-hidden="true">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 60 Q2 48 6 36" stroke="#14233F" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="6" cy="34" r="6" fill="#FFC72C" stroke="#14233F" stroke-width="3"/>
        <path d="M86 62 Q96 70 92 80" stroke="#14233F" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="58" r="36" fill="#FFC72C" stroke="#14233F" stroke-width="4"/>
        <path d="M17 44 Q50 2 83 44 Z" fill="#1B4F9C" stroke="#14233F" stroke-width="4" stroke-linejoin="round"/>
        <path d="M60 42 Q80 38 94 46" stroke="#14233F" stroke-width="4" fill="#1B4F9C"/>
        <circle cx="50" cy="26" r="4" fill="#FFC72C" stroke="#14233F" stroke-width="2"/>
        <ellipse cx="38" cy="56" rx="7" ry="9" fill="#fff" stroke="#14233F" stroke-width="3"/>
        <ellipse cx="62" cy="56" rx="7" ry="9" fill="#fff" stroke="#14233F" stroke-width="3"/>
        <circle cx="40" cy="58" r="3.5" fill="#14233F"/><circle cx="64" cy="58" r="3.5" fill="#14233F"/>
        <circle cx="28" cy="70" r="5" fill="#F48FB1"/><circle cx="72" cy="70" r="5" fill="#F48FB1"/>
        <path d="M38 72 Q50 84 62 72 Z" fill="#E8443A" stroke="#14233F" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bubble comic" id="bubble" aria-live="polite">CIAO! GIOCHIAMO?</div>
  </div>
  <div class="score comic" id="score">⭐ <span id="pts">0</span> PUNTI</div>
  <button id="btnInvia" title="Invia i punti all'insegnante">📤 INVIA</button>
  <button id="btnReset" title="Azzera i punti">AZZERA</button>
  <button id="btnHome">🏠 MENU</button>
  <button id="btnFull" title="Schermo intero">⛶</button>
</header>

<main>

  <section class="view on" id="v-home">
    <div class="intro">
      <h2 class="comic">DOVE VADO? COSA FACCIO?</h2>
      <p>ITALIANO L2 · LIVELLO A1 · GUARDA IL LUOGO, SCEGLI IL VERBO, DI' LA FRASE!</p>
    </div>
    <div class="tiles">
      <button class="tile" data-go="flash"><span class="ic">🃏</span><b class="comic">1. FLASHCARD</b><span>GUARDA IL LUOGO, GIRA LA CARTA E LEGGI LA FRASE.</span></button>
      <button class="tile" data-go="quiz"><span class="ic">🎯</span><b class="comic">2. SCEGLI IL VERBO</b><span>COMPLETA LA FRASE. GIUSTO SUBITO = 2 PUNTI.</span></button>
      <button class="tile" data-go="memo"><span class="ic">🔗</span><b class="comic">3. TROVA LA COPPIA</b><span>18 CARTE NUMERATE: DI' DUE NUMERI E TROVA IMMAGINE + FRASE.</span></button>
      <button class="tile" data-go="parla"><span class="ic">🎤</span><b class="comic">4. PARLA!</b><span>VEDI SOLO L'IMMAGINE. DI' IL LUOGO E LA FRASE.</span></button>
    </div>
    <div class="strip" id="strip"></div>
  </section>

  <section class="view" id="v-flash">
    <div class="flipwrap">
      <div class="flip" id="fc" role="button" tabindex="0" aria-label="Gira la carta">
        <div class="face front">
          <div class="art" id="fcArtF"></div>
          <span class="sign" id="fcPlace"></span>
          <span class="tap">👆 TOCCA PER GIRARE</span>
        </div>
        <div class="face back">
          <div class="art" id="fcArtB"></div>
          <span class="sign" id="fcPlace2"></span>
          <div class="sent" id="fcSent"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button id="fcPrev">◀ PRIMA</button>
      <button id="fcFlip" class="go">🔄 GIRA</button>
      <button id="fcSay">🔊 ASCOLTA</button>
      <button id="fcNext">DOPO ▶</button>
      <span class="count comic" id="fcCount"></span>
    </div>
  </section>

  <section class="view" id="v-quiz">
    <div id="quizBody">
      <div class="two">
        <div class="frame"><div class="art" id="qArt"></div></div>
        <div class="qside">
          <span class="sign" id="qPlace"></span>
          <div class="sent" id="qSent"></div>
          <div class="opts" id="qOpts"></div>
          <div class="controls" style="justify-content:flex-start">
            <button id="qSay">🔊 ASCOLTA</button>
            <button id="qNext" class="go" hidden>AVANTI ▶</button>
          </div>
        </div>
      </div>
      <div class="dots" id="qDots"></div>
    </div>
    <div class="endbox" id="quizEnd" hidden>
      <div class="big comic">BRAVISSIMI!</div>
      <p>HAI COMPLETATO TUTTE LE 9 FRASI. 🎉</p>
      <button class="go" id="qAgain">🔁 GIOCA ANCORA</button>
    </div>
  </section>

  <section class="view" id="v-memo">
    <div class="mgrid" id="mGrid"></div>
    <div class="controls">
      <span class="count comic" id="mCount"></span>
      <button id="mAgain">🔀 MESCOLA DI NUOVO</button>
    </div>
  </section>

  <section class="view" id="v-parla">
    <div class="two">
      <div class="frame"><div class="art" id="pArt"></div></div>
      <div>
        <div class="reveal">
          <button id="pShowPlace">👀 MOSTRA IL LUOGO</button>
          <button id="pShowSent">📝 MOSTRA LA FRASE</button>
          <button id="pSay">🔊 ASCOLTA</button>
        </div>
        <div class="hidebox" id="pPlace"></div>
        <div class="sent" id="pSent" style="text-align:left;max-width:none"></div>
        <div class="pts">
          <button data-p="1" data-w="BENE!">🟢 <b class="comic">+1</b><br>RICONOSCE IL LUOGO</button>
          <button data-p="2" data-w="BRAVO!">🟡 <b class="comic">+2</b><br>SCEGLIE IL VERBO</button>
          <button data-p="3" data-w="SUPER!">🔵 <b class="comic">+3</b><br>TUTTA LA FRASE DA SOLO</button>
          <button data-p="1" data-w="WOW!">⭐ <b class="comic">+1</b><br>BONUS: NUOVA FRASE</button>
        </div>
        <div class="controls" style="justify-content:flex-start">
          <button id="pNext" class="go">PROSSIMA ▶</button>
          <span class="count comic" id="pCount"></span>
        </div>
      </div>
    </div>
  </section>

</main>

<div class="burst" id="burst"><div class="bt comic" id="burstTxt"></div></div>

<script src="../comune/condividi.js"></script>
<script>
/* ================= ILLUSTRAZIONI (SVG ORIGINALI) ================= */
const OL='#14233F';
const T=(x,y,s,t,fill='#fff',f='Lexend, Verdana, sans-serif',w=800)=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="${w}" fill="${fill}" text-anchor="middle" font-family="${f}">${t}</text>`;
const BANG='Bangers, Impact, sans-serif';
const SKY='<rect width="240" height="180" fill="#BFE3FA"/>';
const SUN=(x=210,y=24)=>`<circle cx="${x}" cy="${y}" r="12" fill="#FFD54A" stroke="${OL}" stroke-width="1.5"/>`;
const CLOUD=(x,y)=>`<g fill="#fff"><ellipse cx="${x}" cy="${y}" rx="16" ry="7"/><ellipse cx="${x+11}" cy="${y-5}" rx="11" ry="8"/></g>`;
const W=(x,y,w=18,h=18)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#90CAF9" stroke="#fff" stroke-width="2"/>`;
/* personaggio con faccia */
const P=(x,y,c,s,hair='#3E2723')=>`<g>
<rect x="${x-9}" y="${y+9}" width="18" height="26" rx="8" fill="${c}" stroke="${OL}" stroke-width="1.5"/>
<rect x="${x-7}" y="${y+33}" width="5" height="14" rx="2" fill="#37474F"/><rect x="${x+2}" y="${y+33}" width="5" height="14" rx="2" fill="#37474F"/>
<circle cx="${x}" cy="${y}" r="9" fill="${s}" stroke="${OL}" stroke-width="1.5"/>
<path d="M${x-9} ${y-1} Q${x} ${y-15} ${x+9} ${y-1} Q${x} ${y-6} ${x-9} ${y-1} Z" fill="${hair}"/>
<circle cx="${x-3.2}" cy="${y+1}" r="1.4" fill="${OL}"/><circle cx="${x+3.2}" cy="${y+1}" r="1.4" fill="${OL}"/>

function books(){

  let s='',k=0;
  for(const y of [30,62,94]){
    let x=30;

      const h=24-((k*5)%7);

}

/* ================= MASCOTTE ================= */
function say(t){
  $('#bubble').textContent=t;
  const m=$('#mascot'); m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop');
}

/* ================= VOCE ================= */
function speak(t){
  try{
    const u=new SpeechSynthesisUtterance(t.replace(/’/g,"'").toLowerCase());
    u.lang='it-IT'; u.rate=.8;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('it'));
    if(v) u.voice=v;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= PUNTI + ESPLOSIONE ================= */
let score=0;
function addPts(n,word){
  score+=n; $('#pts').textContent=score;
  const s=$('#score'); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
  burst(word||pick(YES),'+'+n+' ⭐');
}
function burst(big,small=''){
  $('#burstTxt').innerHTML=big+(small?`<small>${small}</small>`:'');
  const e=$('#burst'); e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
}
$('#btnInvia').onclick=()=>condividi(document.title,['PUNTI: '+score]);
$('#btnReset').onclick=()=>{score=0; $('#pts').textContent=0; say('SI RICOMINCIA!')};

function show(v){
  current=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  say(HELLO[v]);
  if(v==='flash') renderFlash();
  if(v==='quiz') startQuiz();
  if(v==='memo') startMemo();
  if(v==='parla') startParla();
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#btnHome').onclick=()=>show('home');

};

/* ================= 1. FLASHCARD ================= */
let fi=0;
function renderFlash(){
  const d=D[fi], card=$('#fc');
  card.classList.remove('flipped');
  card.style.setProperty('--c',d.c);
  $('#fcArtF').innerHTML=ART[d.id]; $('#fcArtB').innerHTML=ART[d.id];
  $('#fcPlace').textContent=d.luogo; $('#fcPlace2').textContent=d.luogo;
  $('#fcSent').innerHTML=full(d);
  $('#fcCount').textContent=`${fi+1} / ${D.length}`;
}
function flipFlash(){
  const c=$('#fc'); c.classList.toggle('flipped');
  if(c.classList.contains('flipped')){ speak(plain(D[fi])); say('RIPETI CON ME!'); }
  else say('CHE POSTO È?');
}
$('#fc').onclick=flipFlash;
$('#fc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flipFlash()}};
$('#fcFlip').onclick=flipFlash;
$('#fcPrev').onclick=()=>{fi=(fi-1+D.length)%D.length; renderFlash(); say('CHE POSTO È?')};
$('#fcNext').onclick=()=>{fi=(fi+1)%D.length; renderFlash(); say('CHE POSTO È?')};
$('#fcSay').onclick=()=>{const c=$('#fc'); speak(c.classList.contains('flipped')?plain(D[fi]):D[fi].luogo)};

}
function renderQ(){
  const d=D[qOrder[qi]]; qTries=0; qDone=false;
  $('#v-quiz').style.setProperty('--c',d.c);
  $('#qArt').innerHTML=ART[d.id];
  $('#qPlace').textContent=d.luogo;
  $('#qSent').innerHTML=blank(d);
  $('#qNext').hidden=true;
  $('#qOpts').innerHTML='';
  shuffle(d.opts).forEach(o=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=o;
    b.onclick=()=>answer(b,o,d);
    $('#qOpts').appendChild(b);
  });
  $('#qDots').innerHTML=qOrder.map((_,i)=>`<i class="${i<qi?'done':i===qi?'now':''}"></i>`).join('');
}
function answer(b,o,d){
  if(qDone) return;
  if(o===d.v){
    qDone=true; b.classList.add('ok');
    const bl=$('#blank'); bl.textContent=d.v; bl.classList.add('filled');
    const w=qTries===0?pick(YES):'SÌ! GIUSTO!';
    say(w); addPts(qTries===0?2:1, qTries===0?w:'GIUSTO!');
    document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    $('#qNext').hidden=false; $('#qNext').focus();
    speak(plain(d));
  }else{
    qTries++; b.classList.add('bad'); b.disabled=true;
    say(pick(['QUASI! RIPROVA!','NO… PROVA ANCORA!','OPS! UN ALTRO?']));
  }
}
$('#qNext').onclick=()=>{
  qi++;
  if(qi>=qOrder.length){ $('#quizBody').hidden=true; $('#quizEnd').hidden=false; burst('EVVIVA!','🎉'); say('SIETE CAMPIONI!'); }
  else { renderQ(); say(HELLO.quiz); }
};
$('#qSay').onclick=()=>{const d=D[qOrder[qi]]; speak(qDone?plain(d):d.luogo)};
$('#qAgain').onclick=()=>{startQuiz(); say(HELLO.quiz)};

/* ================= 3. TROVA LA COPPIA (NUMERATE) ================= */
let mOpen=[],mLock=false,mFound=0;
function startMemo(){
  mOpen=[]; mLock=false; mFound=0;
  const cards=shuffle(D.flatMap(d=>[{d,t:'img'},{d,t:'txt'}]));
  const g=$('#mGrid'); g.innerHTML='';
  cards.forEach(({d,t},i)=>{
    const n=i+1;
    const b=document.createElement('button');
    b.className='mcard'; b.dataset.id=d.id; b.dataset.t=t;
    b.style.setProperty('--c',d.c);
    b.setAttribute('aria-label','Carta '+n);
    b.innerHTML=`<div class="mi"><div class="mf cover"><span class="num comic">${n}</span></div><div class="mf face2"><span class="corner comic">${n}</span>${
      t==='img'?`<div class="art">${ART[d.id]}</div>`:`<div class="mtxt">${plain(d)}</div>`}</div></div>`;
    b.onclick=()=>pickCard(b,d);
    g.appendChild(b);
  });
  $('#mCount').textContent=`COPPIE: 0 / ${D.length}`;
}
function pickCard(b,d){
  if(mLock||b.classList.contains('open')||b.classList.contains('done')) return;
  b.classList.add('open'); mOpen.push(b);
  if(mOpen.length<2){ say('E ADESSO? UN ALTRO NUMERO!'); return; }
  const [a,c]=mOpen;
  if(a.dataset.id===c.dataset.id && a.dataset.t!==c.dataset.t){
    a.classList.add('done'); c.classList.add('done'); mOpen=[];
    mFound++; $('#mCount').textContent=`COPPIE: ${mFound} / ${D.length}`;
    addPts(1,'COPPIA!'); speak(plain(d)); say(pick(YES));
    if(mFound===D.length) setTimeout(()=>{burst('CAMPIONI!','🏆'); say('TUTTE LE COPPIE!')},1300);
  }else{
    mLock=true; say('NO… RICORDA I NUMERI!');
    setTimeout(()=>{a.classList.remove('open'); c.classList.remove('open'); mOpen=[]; mLock=false},1400);
  }
}
$('#mAgain').onclick=()=>{startMemo(); say(HELLO.memo)};

/* ================= 4. PARLA! ================= */
let pOrder=[],pi=0;
function startParla(){ pOrder=shuffle(D.map((_,i)=>i)); pi=0; renderP(); }
function renderP(){
  const d=D[pOrder[pi]];
  $('#v-parla').style.setProperty('--c',d.c);
  $('#pArt').innerHTML=ART[d.id];
  $('#pPlace').innerHTML=''; $('#pSent').innerHTML='';
  $('#pCount').textContent=`${pi+1} / ${D.length}`;
}
$('#pShowPlace').onclick=()=>{const d=D[pOrder[pi]]; $('#pPlace').innerHTML=`<span class="sign">${d.luogo}</span>`; speak(d.luogo)};
$('#pShowSent').onclick=()=>{const d=D[pOrder[pi]]; $('#pSent').innerHTML=full(d); speak(plain(d))};
$('#pSay').onclick=()=>speak(plain(D[pOrder[pi]]));
document.querySelectorAll('.pts button').forEach(b=>b.onclick=()=>{addPts(+b.dataset.p,b.dataset.w); say(b.dataset.w)});
$('#pNext').onclick=()=>{pi=(pi+1)%pOrder.length; if(pi===0) pOrder=shuffle(pOrder); renderP(); say(HELLO.parla)};

/* ================= TASTIERA ================= */
document.addEventListener('keydown',e=>{
  if(current==='flash'){
    if(e.key==='ArrowRight') $('#fcNext').click();
    if(e.key==='ArrowLeft') $('#fcPrev').click();
    if(e.key===' '){e.preventDefault(); flipFlash();}
  }
  if(current==='parla' && e.key==='ArrowRight') $('#pNext').click();
  if(current==='quiz' && e.key==='ArrowRight' && !$('#qNext').hidden) $('#qNext').click();
});
try{ speechSynthesis.getVoices(); }catch(e){}
</script>
