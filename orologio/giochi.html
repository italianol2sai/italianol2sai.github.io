<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giochi: l'orologio</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../comune/giochi.css">
<style>
  .clk { display: flex; justify-content: center; margin: 8px 0 12px; }
  .clk svg { width: min(62vw, 230px); height: auto; }
  .clk svg.clk24 { width: min(80vw, 300px); }
  .g-quiz.n3 { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .g-quiz.n4 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .g-quiz .g-btn { font-size: 1.15rem; padding: 14px 8px; }
  .g-quiz.n4 .g-btn { font-family: 'Courier New', monospace; font-size: 1.7rem; }
  .target { text-align: center; font-size: 1.3rem; font-weight: 700; margin: 6px 0; overflow-wrap: anywhere; }
  .comandi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-width: 420px; margin: 0 auto 10px; }
  .comandi .g-btn { font-size: 1.05rem; padding: 12px 6px; }
  .comandi .ore { border-color: #c8323b; } .comandi .min { border-color: #2f63ad; }
  .riga { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .esito { text-align: center; font-weight: 700; min-height: 1.4em; }
  .esito.ok { color: var(--g-ok); } .esito.no { color: var(--g-no); }
  .g-carta.clkc svg { width: 100%; height: auto; max-width: 90px; }
  .g-carta.frase span { font-size: .85rem; line-height: 1.2; }
</style>
<!-- icone -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icone/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="/icone/apple-touch-icon.png">
<link rel="manifest" href="/icone/manifest.webmanifest">
<meta name="theme-color" content="#1f8a4c">
<meta name="apple-mobile-web-app-title" content="Autoapprendimento">
<meta property="og:site_name" content="Autoapprendimento · Italiano L2 ETNIE">
<meta property="og:image" content="https://italianol2sai.github.io/icone/condividi.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- /icone -->
</head>
<body>
<div class="g-wrap">
  <a class="back" href="./">← L'OROLOGIO</a>
  <h1>🎲 GIOCHI: L'OROLOGIO</h1>
  <p class="sub">4 GIOCHI CORTI CON LE ORE · LIVELLO A1</p>
  <main id="giochi"></main>
</div>
<script src="../comune/condividi.js"></script>
<script src="orologio.js?v=20261127c"></script>
<script>
(function () {
  var O = window.OROLOGIO, main = document.getElementById("giochi");
  function el(t, a, c) {
    var e = document.createElement(t);
    for (var k in a || {}) { if (k === "text") e.textContent = a[k]; else if (k === "html") e.innerHTML = a[k]; else if (k === "on") e.onclick = a[k]; else e.setAttribute(k, a[k]); }
    (c || []).forEach(function (x) { if (x) e.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
    return e;
  }
  function leggi(k) { try { return +localStorage.getItem(k) || 0; } catch (e) { return 0; } }
  function scrivi(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function mescola(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var MINUTI = [0, 0, 5, 10, 15, 15, 20, 25, 30, 30, 40, 45, 45, 50, 55];
  function caso() { return { h: 1 + Math.floor(Math.random() * 12), m: MINUTI[Math.floor(Math.random() * MINUTI.length)] }; }
  function chiave(t) { return t.h * 60 + t.m; }
  // ore simili: stessa ora con altri minuti, o un'ora prima/dopo (così bisogna guardare bene E/MENO)
  function diversi(t, k) {
    var s = {}, out = [t]; s[chiave(t)] = 1; var n = 0;
    while (out.length < k && n++ < 300) {
      var r = Math.random(), x;
      if (r < .4) x = { h: t.h, m: MINUTI[Math.floor(Math.random() * MINUTI.length)] };
      else if (r < .7) x = { h: (t.h % 12) + 1, m: t.m };
      else x = caso();
      if (O.parole(x.h, x.m) === O.parole(t.h, t.m)) continue;
      if (!s[chiave(x)]) { s[chiave(x)] = 1; out.push(x); }
    }
    return out;
  }

  var area = el("div", { class: "g-area" });
  var GIOCHI = [["quiz", "🕰️", "CHE ORE SONO?"], ["lancette", "👆", "METTI LE LANCETTE"], ["tempo", "⏱️", "A TEMPO: DIGITALE"], ["memory", "🃏", "MEMORY"]];
  var schede = el("div", { class: "g-schede", role: "tablist" }), aperto = "quiz";
  GIOCHI.forEach(function (g) { schede.appendChild(el("button", { class: "g-scheda", "data-g": g[0], on: function () { apri(g[0]); } }, [el("span", { text: g[1] }), " " + g[2]])); });
  main.appendChild(schede); main.appendChild(area);
  function apri(nome) {
    aperto = nome;
    [].forEach.call(schede.children, function (b) { b.classList.toggle("on", b.getAttribute("data-g") === nome); });
    area.innerHTML = ""; if (window._timer) clearInterval(window._timer); try { speechSynthesis.cancel(); } catch (e) {}
    ({ quiz: quiz, lancette: lancette, tempo: tempo, memory: memory })[nome]();
    try { history.replaceState(null, "", "#" + nome); } catch (e) {}
  }
  function fine(msg, ancora) {
    area.appendChild(el("div", { class: "g-fine" }, [el("p", { text: msg }), el("button", { class: "g-btn", text: "GIOCA ANCORA ▶", on: ancora }),
      window.bottoniInvio ? window.bottoniInvio("GIOCHI: L'OROLOGIO", function () { return [msg]; }, { classe: "g-btn", maiuscolo: true }) : null]));
  }

  // ---------------- CHE ORE SONO? (10 orologi, 3 frasi)
  function quiz() {
    var giro = 0, giusti = 0, TOT = 10;
    var conta = el("p", { class: "g-info" }), clk = el("div", { class: "clk" }), box = el("div", { class: "g-quiz n3" });
    area.appendChild(el("p", { class: "g-info", text: "GUARDA L'OROLOGIO E TOCCA LA FRASE GIUSTA." }));
    [conta, clk, box].forEach(function (x) { area.appendChild(x); });
    function nuovo() {
      giro++; var t = caso(); conta.textContent = "OROLOGIO " + giro + " DI " + TOT + " · ⭐ " + giusti;
      clk.innerHTML = O.svg(t.h, t.m); box.innerHTML = ""; var fatto = false;
      mescola(diversi(t, 3)).forEach(function (x) {
        var f = O.parole(x.h, x.m), ok = chiave(x) === chiave(t);
        box.appendChild(el("button", { class: "g-btn", text: f, on: function (ev) {
          if (fatto) return; fatto = true;
          if (ok) { giusti++; ev.target.classList.add("ok"); } else { ev.target.classList.add("no");
            [].forEach.call(box.children, function (b) { if (b.textContent === O.parole(t.h, t.m)) b.classList.add("ok"); }); }
          O.voce(O.parole(t.h, t.m));
          setTimeout(function () { if (giro >= TOT) { var r = leggi("orologio-quiz"); if (giusti > r) scrivi("orologio-quiz", giusti);
            area.innerHTML = ""; fine("HAI LETTO " + giusti + " OROLOGI GIUSTI SU " + TOT + "." + (giusti > r ? " NUOVO RECORD! 🏆" : ""), quiz); } else nuovo(); }, 1500);
        } }));
      });
    }
    nuovo();
  }

  // ---------------- METTI LE LANCETTE (5 frasi)
  function lancette() {
    var giro = 0, giusti = 0, TOT = 5, target, h, m, tentativi;
    var tgt = el("div", { class: "target" }), clk = el("div", { class: "clk" }), esito = el("p", { class: "esito" });
    function cambia(dh, dm) { m += dm; if (m >= 60) { m -= 60; h++; } if (m < 0) { m += 60; h--; } h = ((h - 1 + 12 + dh) % 12) + 1; mostra(); }
    function mostra() { clk.innerHTML = O.svg24(h, m); esito.textContent = ""; esito.className = "esito"; }
    var comandi = el("div", { class: "comandi" }, [
      el("button", { class: "g-btn ore", text: "🔴 − 1 ORA", on: function () { cambia(-1, 0); } }),
      el("button", { class: "g-btn ore", text: "🔴 + 1 ORA", on: function () { cambia(1, 0); } }),
      el("button", { class: "g-btn min", text: "🔵 − 5 MINUTI", on: function () { cambia(0, -5); } }),
      el("button", { class: "g-btn min", text: "🔵 + 5 MINUTI", on: function () { cambia(0, 5); } })]);
    // un giro sì e uno no l'ora è scritta come in stazione (24 ore): 15:20 → lancetta corta sul 3 (15)
    function nuovo() { giro++; tentativi = 0; target = caso(); h = 12; m = 0; mostra();
      target.d24 = giro % 2 === 0; if (target.d24 && Math.random() < .7) target.h24 = target.h === 12 ? 12 : target.h + 12; else target.h24 = target.h % 12;
      tgt.textContent = giro + "/" + TOT + " · " + (target.d24 ? "METTI: " + O.digitale(target.h24, target.m) : O.parole(target.h, target.m)); }
    var ok = el("button", { class: "g-btn", text: "✅ CONTROLLA", on: function () {
      tentativi++;
      if (h === target.h && m === target.m) { if (tentativi === 1) giusti++; esito.textContent = "BRAVO! " + O.parole(h, m) + " = " + O.digitale(h, m); esito.className = "esito ok"; O.voce(O.parole(h, m));
        setTimeout(function () { if (giro >= TOT) { area.innerHTML = ""; fine("HAI MESSO LE LANCETTE GIUSTE " + giusti + " VOLTE SU " + TOT + " AL PRIMO TENTATIVO.", lancette); } else nuovo(); }, 1600); }
      else { esito.textContent = "NON ANCORA: ORA È " + O.parole(h, m) + ". RIPROVA!"; esito.className = "esito no"; }
    } });
    area.appendChild(el("p", { class: "g-info", text: "LEGGI LA FRASE O L'ORA (14:35 = LANCETTA CORTA SUL 2, PERCHÉ 14 È IL NUMERO PICCOLO SOTTO IL 2). USA I PULSANTI: 🔴 LA LANCETTA CORTA (ORE), 🔵 LA LANCETTA LUNGA (MINUTI)." }));
    [tgt, clk, comandi, el("div", { class: "riga" }, [el("button", { class: "g-btn", text: "🔊 ASCOLTA", on: function () { O.voce(O.parole(target.h, target.m)); } }), ok]), esito]
      .forEach(function (x) { area.appendChild(x); });
    nuovo();
  }

  // ---------------- A TEMPO: orologio → ora digitale (60 secondi)
  function tempo() {
    var sec = 60, punti = 0, partito = false;
    var barra = el("div", { class: "g-tempo" }, [el("span")]), info = el("p", { class: "g-info" }), clk = el("div", { class: "clk" }), box = el("div", { class: "g-quiz n4" });
    var via = el("button", { class: "g-btn", text: "▶ COMINCIA", on: function () { via.remove(); parti(); } });
    area.appendChild(el("p", { class: "g-info", text: "GUARDA L'OROLOGIO E TOCCA L'ORA DIGITALE GIUSTA. HAI 60 SECONDI!" }));
    [barra, info, el("div", { class: "riga" }, [via]), clk, box].forEach(function (x) { area.appendChild(x); });
    function stato() { info.textContent = "⏱️ " + sec + " SECONDI · ⭐ " + punti + " PUNTI"; barra.firstChild.style.width = (sec / 60 * 100) + "%"; }
    function domanda() {
      var t = caso(); clk.innerHTML = O.svg(t.h, t.m); box.innerHTML = "";
      mescola(diversi(t, 4)).forEach(function (x) {
        box.appendChild(el("button", { class: "g-btn", text: O.digitale(x.h, x.m), on: function (ev) {
          if (chiave(x) === chiave(t)) { punti++; ev.target.classList.add("ok"); setTimeout(domanda, 350); }
          else { ev.target.classList.add("no"); sec = Math.max(0, sec - 3); }
          stato();
        } }));
      });
    }
    function parti() {
      partito = true; domanda();
      window._timer = setInterval(function () {
        sec--; stato();
        if (sec <= 0) { clearInterval(window._timer); box.innerHTML = ""; clk.innerHTML = "";
          var r = leggi("orologio-tempo"); if (punti > r) scrivi("orologio-tempo", punti);
          fine("TEMPO FINITO! HAI FATTO " + punti + " PUNTI." + (punti > r ? " NUOVO RECORD! 🏆" : " RECORD: " + r + " PUNTI."), tempo); }
      }, 1000);
    }
    stato();
  }

  // ---------------- MEMORY: orologio e frase
  function memory() {
    var s = {}, ore = [];
    while (ore.length < 6) { var x = caso(), f = O.parole(x.h, x.m); if (!s[f]) { s[f] = 1; ore.push(x); } }
    var carte = [];
    ore.forEach(function (t, i) { carte.push({ id: i, clk: true, t: t }); carte.push({ id: i, t: t }); });
    carte = mescola(carte);
    var aperte = [], trovate = 0, mosse = 0, griglia = el("div", { class: "g-memory" });
    carte.forEach(function (c) {
      var faccia = c.clk ? el("span", { html: O.svg(c.t.h, c.t.m, 90) }) : el("span", { text: O.parole(c.t.h, c.t.m) });
      var b = el("button", { class: "g-carta " + (c.clk ? "clkc" : "frase"), "aria-label": "CARTA" }, [faccia]);
      b.onclick = function () {
        if (b.classList.contains("su") || aperte.length === 2) return;
        b.classList.add("su"); aperte.push([b, c]); if (!c.clk) O.voce(O.parole(c.t.h, c.t.m));
        if (aperte.length === 2) {
          mosse++; var a = aperte;
          if (a[0][1].id === a[1][1].id && a[0][1].clk !== a[1][1].clk) {
            a.forEach(function (y) { y[0].classList.add("ok"); }); aperte = []; trovate++;
            if (trovate === ore.length) { var r = leggi("orologio-mem"); if (!r || mosse < r) scrivi("orologio-mem", mosse);
              fine("BRAVO! HAI TROVATO TUTTE LE COPPIE IN " + mosse + " MOSSE." + (r ? " RECORD: " + Math.min(r, mosse) + " MOSSE." : ""), memory); }
          } else setTimeout(function () { a.forEach(function (y) { y[0].classList.remove("su"); }); aperte = []; }, 1200);
        }
      };
      griglia.appendChild(b);
    });
    area.appendChild(el("p", { class: "g-info", text: "GIRA DUE CARTE: TROVA L'OROLOGIO E LA SUA FRASE." }));
    area.appendChild(griglia);
  }

  var h = (location.hash || "").slice(1);
  apri(["quiz", "lancette", "tempo", "memory"].indexOf(h) >= 0 ? h : "quiz");
})();
</script>
</body>
</html>
