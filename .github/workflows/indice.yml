# Rigenera la pagina principale (index.html) quando cambia elenco.html o lo script dell'indice.
name: Aggiorna indice
on:
  push:
    branches: [main]
    paths: ["elenco.html", "_strumenti/indice.py", "_strumenti/indice.html"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 _strumenti/indice.py
      - run: |
          if git diff --quiet index.html; then echo "index.html già aggiornato"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Aggiorna index.html da elenco.html"
          git push
